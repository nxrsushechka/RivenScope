upport.description": "Just write us a mail:{input}", "app.faq.how_to": "How to use this service?", "app.faq.how_to.description.1": "If you wish to look through some orders just use the search function on the home page and contact the buyer/seller.", "app.faq.how_to.description.2": "If you want to place an order, you must be registered on our site. We have 2 options:", "app.faq.how_to.description.2.steam": "Registration through Steam Login.", "app.faq.how_to.description.2.standalone": "Registration by our standalone system (See below).", "app.faq.how_to.description.3": "After registration and verification of your in-game name, you can place orders.", "app.faq.how_to.description.4.warn": "Don\u2019t forget to update your in-game online status - use the switcher on top right corner (menu)", "app.faq.how_to.description.5": "Other users will see your status, and if you\u2019re online they can contact you directly via an in-game Private Message.", "app.faq.statusManagement": "Status Management", "app.faq.statusManagement.description.general": "When you start a new browser or mobile app session, your status is automatically set to \u201cinvisible\u201d, unless an existing session has already set a status.{br}Statuses work as follows:", "app.faq.statusManagement.description.general.1": "{onlineInGame} \u2014 You are in-game and ready to trade.", "app.faq.statusManagement.description.general.2": "{online} \u2014 You\u2019re not currently in-game but available to trade within about an hour and can respond through the site.", "app.faq.statusManagement.description.general.3": "{invisible} \u2014 You\u2019re not available and have no trading obligations.", "app.faq.statusManagement.description.keep": "By default, your \u201conline\u201d or \u201conline in-game\u201d status is kept only while your connection to warframe.market is active (for example, while your browser tab or app is open).{br}Once you close the browser or lose connection, your status automatically changes to \u201coffline.\u201d{br}This behavior works well for PC users, but it\u2019s inconvenient for mobile users since phones often suspend connections when the app or browser goes into the background or the screen locks.{br}To fix that, you can now use the \u201c{keepStatusFor}\u201d option:", "app.faq.statusManagement.description.keep.1": "{icon} (default) \u2014 Keep your status only while connected (same as before).", "app.faq.statusManagement.description.keep.2": "1h / 2h / 4h \u2014 Keep your chosen status for that duration, even if you close the browser or app.{br}After the selected time, your status automatically reverts to \u201coffline.\u201d", "app.faq.statusManagement.description.keep.example": "Example.{br}You can set your status to \u201conline in-game\u201d for 2 hours, close the app or browser, and we\u2019ll maintain that status for the full 2 hours before switching you back to \u201coffline.\u201d", "app.faq.verification_why": "Why do you need to verify my in-game name?", "app.faq.verification_why.description": "We don't want to see fake accounts and fake orders on our site.{br}It would create a bad experience for everyone.{br}We apologize if it means a few more minutes of setting up before you can trade, but this is a necessary procedure.", "app.faq.mail_usage": "How will you use my mail?", "app.faq.mail_usage.description": "Currently - only for login purposes.{br}You won\u2019t receive any messages from us. If we\u2019ll introduce some sort of email notifications in the future, we\u2019ll let you know in advance and provide an option to enable/disable the new features.", "app.faq.info_we_know": "What type of information will your service know about me?", "app.faq.info_we_know.description": "If you use our standalone login, we\u2019ll know your email.{br}You can use a fake email, it's your choice, and how we use your address is described above.{br}If you use Steam login, we\u2019ll know your steam name and steam id.", "app.faq.password_storage": "How do you store my password?", "app.faq.password_storage.description": "Your password isn\u2019t stored in our DB directly.{br}Instead, we store a HASH (by using {link}) generated on the basis of your password and some salt.{br}So no one \u2013 not even us \u2013 can get your password, don\u2019t worry.", "app.faq.change_my_name": "I changed my name in game, how can i change it here on site?", "app.faq.change_my_name.description": "You can re-verify your account, it will take your name from forum.{br}If forum still displays your old name, just re-login (on forum!).{br}If nothing helps, send us a mail with your old name and new one.", "app.faq.enable_notifications": "How to enable desktop notifications?", "app.faq.enable_notifications.description": "If your browser blocks notifications and you want to enable them, you can do so very easily.", "app.faq.enable_notifications.chrome.title": "For chrome browser:", "app.faq.enable_notifications.chrome.description": "1. On the top left corner of your browser, right before the address bar, click on the information icon -> {infoIcon}{br}2. Switch Notifications to `Allow`", "app.faq.enable_notifications.chrome.example": "Example:", "app.faq.enable_notifications.firefox.title": "For firefox browser:", "app.faq.enable_notifications.firefox.description": "1. On the top left corner of your browser, right before the address bar, click on the information icon -> {infoIcon}{br}2. Click `Preferences`{br}3. Click Notifications settings{br}4. Find warframe.market{br}5. Switch status to `Allow`", "app.privacy.title": "Privacy | Warframe Market", "app.privacy.header": "Privacy", "app.privacy.accessInfo.content": "You have the right to request that the company disclose certain information to you about our collection and use of your personal information over the past 12 months. Once we receive and confirm your verifiable consumer request (as described in the section \u201cExercising Access, Data Portability, and Deletion Rights\u201d), we will disclose to you:", "app.privacy.accessInfo.disclose.ourPurpose": "Our business or commercial purpose for collecting or selling that personal information.", "app.privacy.accessInfo.disclose.personalInfo": "The categories of personal information we collected about you.", "app.privacy.accessInfo.disclose.piecesInfo": "The specific pieces of personal information we collected about you (also called data portability request)", "app.privacy.accessInfo.disclose.soldInfo.disclosures": "Disclosures for a business purpose, identifying the personal information categories that each category of recipient obtained", "app.privacy.accessInfo.disclose.soldInfo.sales": "Sales, identifying the personal information categories that each category of recipient purchased", "app.privacy.accessInfo.disclose.soldInfo.title": "If we sold or disclose your personal information for a business purpose, two separate lists disclosing:", "app.privacy.accessInfo.disclose.sources": "The categories of sources for the personal information we collected about you.", "app.privacy.accessInfo.disclose.thirdParties": "The categories of third parties with whom we share that personal information.", "app.privacy.accessInfo.title": "Access to Specific Information and Data Portability Rights", "app.privacy.collectAndUse.advertising": "We may use third-party advertising companies to serve ads when you visit the Site. These companies may use aggregated information (not including your name, address, email address or telephone number) about your visits to this and other Web sites in order to provide advertisements about goods and services of interest to you. If you would like more information about this practice and to know your choices about not having this information used by these companies,", "app.privacy.collectAndUse.title": "Information Collection And Use", "app.privacy.collectAndUse.usingSite": "While using our Site, we may ask you to provide us with certain personally identifiable information that can be used to contact or identify you. Personally identifiable information may include, but is not limited to your name (\u201cPersonal Information\u201c). Our service can upload information about the user's image if the user does it himself and it will be available to other users of Warframe.market.", "app.privacy.contactUs.questings": "If you have any questions about this Privacy Policy, please contact us.", "app.privacy.contactUs.title": "Contact Us", "app.privacy.cookies.title": "Cookies", "app.privacy.cookies.disable": "You can choose to disable or selectively turn off our cookies or third-party cookies in your browser settings, or by managing preferences in programs such as Norton Internet Security. However, this can greatly affect how you are able to interact with the Site as well as most other websites.", "app.privacy.cookies.storeInfo": "We use cookies to store information for your convenience (\u201cSettings\u201c). We also may use third party advertisements on the Site. Some of these advertisers may use technology such as cookies and web beacons when they advertise on the Site, which will also send these advertisers (such as Google through the Google AdSense program) information including your IP address, your ISP , the browser you used to visit our site, and in some cases, whether you have Flash installed. This is generally used for geotargeting purposes (showing New York real estate ads to someone in New York, for example) or showing certain ads based on specific sites visited (such as showing cooking ads to someone who frequents cooking sites).", "app.privacy.dataPortability.exercise": "To exercise the access, data portability, and deletion rights described above, please submit a verifiable consumer request to us by emailing us at", "app.privacy.dataPortability.registered": "Only you, or a person registered with the California Secretary of State that you authorize to act on your behalf, may make a verifiable consumer request related to your personal information. You may also make a verifiable consumer request on behalf of your minor child.", "app.privacy.dataPortability.respond": "We cannot respond to your request or provide you with personal information if we cannot verify your identity or authority to make the request and confirm the personal information relates to you.", "app.privacy.dataPortability.title": "Exercising Access, Data Portability, and Deletion Rights", "app.privacy.dataPortability.verifiableConsumer": "You may only make a verifiable consumer request for access of data portability twice within a 12-month period. The verifiable consumer request must:", "app.privacy.dataPortability.verifiableConsumer.detail": "Describe your request with sufficient detail that allows us to properly understand, evaluate, and respond to it.", "app.privacy.dataPortability.verifiableConsumer.provideInfo": "Provide sufficient information that allows us to reasonably verify you are the person about whom we collected personal information or an authorized representative.", "app.privacy.dataPortability.verifiableRequest": "Making a verifiable consumer request does not require you to create an account with us. We will only use personal information provided in a verifiable consumer request to verify the requestor\u2019s identity or authority to make the request.", "app.privacy.disclores.soldCategorie.identifiers": "[Category A: Identifiers.]", "app.privacy.disclores.soldCategorie.records": "[Category B: California Customer Records personal information categories.]", "app.privacy.disclores.soldCategories": "In the preceding twelve (12) months, the Company has disclosed the following categories of personal information for a business purpose:", "app.privacy.disclores.soldCategories.geoData": "[Category G: Geolocation Data.]", "app.privacy.disclores.soldCategories.inferences": "[Category K: Inferences drawn from other personal information.]", "app.privacy.disclores.soldCategories.internet": "[Category F: Internet or other similar network activity.] operates warframe.market (the \u201cSite\u201c). This page informs you of our policies regarding the collection, use and disclosure of Personal Information we receive from users of the Site.", "app.privacy.lastUpdate.title": "Last updated: February 1st, 2020", "app.privacy.lastUpdate.yourInfo": "We use your Personal Information only for providing and improving the Site. By using the Site, you agree to the collection and use of information in accordance with this policy.", "app.privacy.logData.browserInfo": "Like many site operators, we collect information that your browser sends whenever you visit our Site (\u201cLog Data\u201c).", "app.privacy.logData.info": "This Log Data may include information such as your computer's Internet Protocol (\u201cIP\u201c) address, browser type, browser version, the pages of our Site that you visit, the time and date of your visit, the time spent on those pages and other statistics.", "app.privacy.logData.services": "In addition, we use third party services such as Google Analytics that collect, monitor and analyze this.", "app.privacy.logData.title": "Log Data", "app.privacy.nonDiscrimination.permitted": "Any CCPA-permitted financial incentive we offer will reasonably relate to your value and contain written terms that describe the program\u2019s material aspects.", "app.privacy.nonDiscrimination.rights": "We will not discriminate against you for exercising any of your CCPA rights. Unless permitted by the CCPA, we will not:", "app.privacy.nonDiscrimination.rights.chargePrices": "Charge you different prices or rates for goods or services, including through granting discounts or imposing penalties.", "app.privacy.nonDiscrimination.rights.denyGoods": "Deny you goods or services.", "app.privacy.nonDiscrimination.rights.qualityGoods": "Provide you a different level or quality of goods or services.", "app.privacy.nonDiscrimination.rights.suggestPrice": "Suggest that you may receive a different price or rate for goods or services or a different level of quality of goods or services.", "app.privacy.nonDiscrimination.title": "Non-Discrimination", "app.privacy.notInclude": "Personal information does not include:", "app.privacy.notInclude.deidentified": "Deidentified or aggregated consumer information.", "app.privacy.notInclude.excluded": "Information excluded from the CCPA\u2019s scope, like:", "app.privacy.notInclude.excluded.health": "health or medical information covered by the Health Insurance Portability and Accountability Act of 1996 (HIPAA) and the California Confidentiality of Medical Information Act (CMIA) or clinical trial data;", "app.privacy.notInclude.excluded.personalInfo": "personal information covered by certain sector-specific privacy laws, including the Fair Credit Reporting Act(FRCA), the Gramm-Leach-Bliley Act (GLBA) or California Financial Information Privacy Act (FIPA), and the Driver\u2019s Privacy.", "app.privacy.notInclude.publicly": "Publicly available information from government records.", "app.privacy.personalInfo.additional": "The Company will not collect additional categories of personal information or use the personal information we collected formaterially different, unrelated, or incompatible purposes without providing you notice.", "app.privacy.personalInfo.disclore": "We may use or disclose the personal information we collect for one or more of the following business purposes:", "app.privacy.personalInfo.disclore.account": "To create, maintain, customize, and secure your account with us.", "app.privacy.personalInfo.disclore.enforcement": "To respond to law enforcement requests and as required by applicable law, court order, or governmental regulations.", "app.privacy.personalInfo.disclore.forth": "As described to you when collecting your personal information or as otherwise set forth in the CCPA.", "app.privacy.personalInfo.disclore.inquiries": "To provide you with support and to respond to your inquiries, including investigating and addressing your concerns and monitoring and improving our responses.", "app.privacy.personalInfo.disclore.merger": "To evaluate or conduct a merger, divestiture, restructuring, reorganization, dissolution, or other sale or transfer of some or all of the Company\u2019s assets, whether as a going concern or as part of bankruptcy, liquidation, or similar proceeding, in which personal information held by the Company about our Website users is among the assets transferred.", "app.privacy.personalInfo.disclore.personalize": "To personalize your website, apps, emails, or other product, service or platform experience and to deliver content and product and service offerings relevant to your interests, including targeted offers and ads through our websites, apps, emails, and other products, services and platforms.", "app.privacy.personalInfo.disclore.process": "To process your requests, purchases, transactions, and payments and prevent transactional fraud.", "app.privacy.personalInfo.disclore.reason": "To fulfill or meet the reason you provided the information. For example, if you share your name and contact information to request a newsletter or ask a question about our products or services, we will use that personal information to respond to your inquiry. If you provide your personal information to purchase a product or service, we or our third-party service providers will use that information to process your payment and facilitate delivery. We may also save your information to facilitate new product or service orders and requests.", "app.privacy.personalInfo.disclore.security": "To help maintain the safety, security, and integrity of our websites, apps, emails, and other products, services and platforms, databases and other technology assets, and business.", "app.privacy.personalInfo.disclore.support": "To provide, support, personalize, and develop our websites, emails, and other products, services and platforms.", "app.privacy.personalInfo.disclore.testing": "For testing, research, analysis, and product development, including to develop and improve our websites, apps, emails, and other products, services and platforms.", "app.privacy.personalInfo.title": "Use of Personal Information", "app.privacy.policyChanges.title": "Changes To This Privacy Policy", "app.privacy.policyChanges.update": "We reserve the right to update or change our Privacy Policy at any time and you should check this Privacy Policy periodically. Your continued use of the Service after we post any modifications to the Privacy Policy on this page will constitute your acknowledgment of the modifications and your consent to abide and be bound by the modified Privacy Policy.", "app.privacy.residents.content": "This Privacy Notice for California Residents supplements the information contained elsewhere in this Privacy Notice and applies solely to all visitors, users, and others who reside in the State of California (\u201cconsumers\u201d or \u201cyou\u201d). We adopt this notice to comply with the California Consumer Privacy Act of 2018 (CCPA) and any terms defined in the CCPA have the same meaning when used", "app.privacy.residents.title": "For California Residents: CCPA Information", "app.privacy.rights.content": "The CCPA provides consumers located in the state of California with certain rights regarding their personal information and data. The following section describes those rights and explains how to exercise them:", "app.privacy.rights.title": "Rights and Choices", "app.privacy.salesInfo.advertising": "The company and our advertising partners collect the personal information identified above (such as the cookies stored on your browser, the advertising identifier on your mobile device, or the IP address of your device) when you visit our websites, apps, and other products, services and platforms, or open our emails. We, and our partners, use this information to tailor and deliver ads to you on our websites, apps, emails, and other products, services and platforms, or to help tailor ads to you when you visit others\u2019 sites (or use others\u2019 apps). To tailor ads that may be more relevant to you, we and/or our partners may share the information we collect with third parties.", "app.privacy.salesInfo.services": "In the preceding twelve (12) months, the company has sold the following categories of personal information collected through our ad-supported services:", "app.privacy.salesInfo.soldCategories.geoData": "[Category G: Geolocation Data.]", "app.privacy.salesInfo.soldCategories.identifiers": "[Category A: Identifiers.]", "app.privacy.salesInfo.soldCategories.inferences": "[Category K: Inferences drawn from other personal information.]", "app.privacy.salesInfo.soldCategories.internet": "[Category F: Internet or other similar network activity.]", "app.privacy.salesInfo.title": "Sales of Personal Information", "app.privacy.security.secure": "The security of your Personal Information is important to us, but remember that no method of transmission over the Internet, or method of electronic storage, is 100% secure. While we strive to use commercially acceptable means to protect your Personal Information, we cannot guarantee its absolute security.", "app.privacy.security.title": "Security", "app.privacy.sharingInfo.businessPurpose": "The Company may disclose your personal information to a third-party for a business purpose or sell your personal information, subject to your right to opt-out of those sales (see \u2018Sales of Personal Information\u2019 below). When we disclose personal information for a business purpose, we enter a contract that describes the purpose and requires the recipient to both keep that personal information confidential and not use it for any purpose except performing the contract. The CCPA prohibits third parties who purchase the personal information we hold from reselling it unless you have received explicit notice and an opportunity to opt-out of further sales (see \u2018Sales of Personal Information\u2019 below).", "app.privacy.shari erms of Use Agreement.", "app.tos.account.profile_advertising": "Account profiles may not be used for advertising unrelated content or attempting to defame other users.", "app.tos.account.profile_descriptions": "Account profile descriptions that specify or imply behavior that violates these Terms do not invalidate these Terms and are not enforceable.", "app.tos.account.profile_imagery": "The customizable areas of an account profile may not be used to depict imagery that is obscene, indecent, politically charged, or otherwise offensive.", "app.tos.account.required": "An account is required to access some features of the Site.", "app.tos.account.transfer": "A Site account may not be sold, traded, gifted, or otherwise transferred to anyone else. Any attempt to do so may result in a permanent suspension of the account.", "app.tos.activityStatus": "Activity Status", "app.tos.activityStatus.definition": "The Site allows for Listers to set an activity status (\"status\") that indicates their current availability to trade. The status of a Lister at the time of being contacted will be used to determine whether a violation of these Terms has occurred.", "app.tos.activityStatus.invisible": "\"Invisible\" indicates that the Lister is unavailable or otherwise unable to trade within the allowed time. Listers are not required to respond to any messages or invites received in-game or on the Site while set to this status.{br}If a Lister begins to receive many new trade request messages at once, this status should be used to prevent further new requests, but messages already received before the status change still require a response within the allowed time based on the previous status.", "app.tos.activityStatus.not_auto": "The Site does not automatically change a user's status based on in-game activity.", "app.tos.activityStatus.online": "\"Online\" indicates that the Lister may or may not be in game but is able to respond to Site messages and complete a trade within 1 hour of being contacted.{br}Listers are not required to be in-game other than for performing the trade.", "app.tos.activityStatus.onlineInGame": "\"Online in game\" indicates that the Lister is currently logged into the game, able to use in-game chat, and able to complete a trade within 15 minutes of being contacted in-game.{br}Listers are not required to respond to messages received on the Site while set to this status, but they are required to respond to in-game messages clearly indicating that the Contactor found the Lister through the Site.{br}If the Lister finds they are unable to send or receive messages in-game, such as chat connection errors occurring, their status must be updated within 5 minutes and remain until in-game chat functionality is restored.", "app.tos.api": "API", "app.tos.api.block": "Applications using the API may be blocked at the discretion of the Site developers", "app.tos.api.copyPaste": "Applications that provide a copy/paste message must provide the message in the same format as seen on the Site and include the application name.", "app.tos.api.dataUsage": "API data, unless for personal use or educational purposes, may only be used to provide additional features not available on the Site.{br}Site staff should be contacted prior to making applications using the API public.", "app.tos.api.discord": "Application development using the API can be discussed in Discord.", "app.tos.api.no_support": "Site staff will not provide support for third-party applications and will not be held responsible for payments made to, actions performed by, or content provided by such applications or their developers.", "app.tos.api.rateLimit": "Requests may not be made at a rate faster than 3 per second for listings or 10 per minute for contracts.", "app.tos.appeals": "Appeals", "app.tos.appeals.action_first": "For account suspensions that require action to be taken before the suspension can be removed, appealing does not apply until said action is performed.", "app.tos.appeals.definition": "For most violations, a one-time appeal may be requested, which may result in an account suspension being removed or its duration reduced at the discretion of the moderation team.", "app.tos.appeals.no_further": "No appeals may be requested for further violations, whether similar in nature or not, unless sufficient proof is provided by the suspended user to indicate that the report is invalid or factors outside of the user's control were involved.", "app.tos.appeals.permanent": "Permanent suspensions due to repeated violations or violations including, but not limited to, suspension evasion or impersonation of Site staff, cannot be appealed.", "app.tos.appeals.transaction_limit": "For account suspensions related to transactions deemed suspicious, an appeal cannot be made after the transactions in question are older than 90 days.", "app.tos.contracts": "Contracts", "app.tos.contracts.definition": "Contracts indicate unveiled rivens and adversaries that a Lister intends to sell.", "app.tos.contracts.honor_bids": "A bidder of an auction is required to honor their bids if chosen as the winner and their bid is no older than 7 days.", "app.tos.contracts.increment": "When creating an auction bid higher than any next highest bid made within the last 7 days, the new bid must be no less than either 5% or 100 platinum more, whichever is lower.", "app.tos.contracts.no_bidding_wars": "Bidders may not bid on an auction with the sole intent of raising the current bid with no intent to buy.", "app.tos.contracts.one_per_item": "Only one contract per riven or adversary may be created.", "app.tos.contracts.own": "Listers may only create contracts for rivens or adversaries they own and are willing to sell at the specified selling or auction buyout price.{br}Any prices or conditions present in the contract description are not enforceable.", "app.tos.contracts.properties": "All properties of a contract must match the properties as they appear in-game.{br}Riven attributes must match the values for the entered rank as they appear in the mods console, not the riven cycling screen or Arsenal.", "app.tos.contracts.rank": "The rank for a riven contract must match the rank at which the Lister intends to sell.", "app.tos.disclaimer": "The moderation team reserves all the rights of final explanation.", "app.tos.header": "Terms of Service", "app.tos.note": "Note: ", "app.tos.orders": "Orders", "app.tos.orders.correct_inaccuracy": "If the Lister finds or is otherwise made aware of an inaccuracy with their order, such as already being bought or sold or accidentally entering price and quantity into the wrong fields, the order must be corrected within 5 minutes.", "app.tos.orders.definition": "Orders (\"orders\", \"listings\") indicate items other than contract items that a Lister intends to buy or sell.", "app.tos.orders.inactive": "If a Lister does not log into the Site for 7 days, their orders will become hidden.", "app.tos.orders.max_three": "Up to 3 visible orders of the same item at different prices are allowed.", "app.tos.orders.own_item": "For \"Want to Sell\" orders, the Lister must either own at least the specified quantity or be able to attain that quantity upon the Contactor's request, such as with syndicate items.", "app.tos.orders.specified": "Listers may only create orders for items they are willing to buy or sell for the specified price and up to the specified quantity.", "app.tos.intro": "This is the Terms of Service (\"Terms\", \"TOS\") that defines appropriate usage of the warframe.market website (the \"Site\" or \"Website\") by its users, including those who create orders (\"Listers\") and those who initiate conversation with Listers (\"Contactors\").", "app.tos.preamble": "By accessing or using this website, you agree to the following terms and conditions described. If you do not agree to these terms, do not use this website.", "app.tos.reporting": "Reporting", "app.tos.reporting.definition": "A Lister or Contactor who has an account on the Site and is in violation of these Terms may be reported using the Report option found on the Reputation tab of their profile. A Site account is required to submit a report using this method.{br}Screenshots must be uploaded to a trusted image hosting website and provided as links in reports. The moderation team may refuse to open links at their own discretion in cases where they are unfamiliar with the website chosen.{br}Provided links may not expire within a limited time window or contain any sort of restricted access limitations.", "app.tos.reporting.ingame_reports": "Reports submitted using the in-game reporting system will not be seen by Site staff.", "app.tos.reporting.no_false": "Reports may not be submitted with false, misleading, or malicious intent", "app.tos.reporting.no_public": "Public channels of any kind may not be used to submit reports unless endorsed by the moderation team", "app.tos.reporting.only_involved": "A report based on an interaction that violates these Terms may only be submitted by the Lister or Contactor involved in that interaction.", "app.tos.reporting.proof": "Provided proof must include, where applicable:", "app.tos.reporting.proof.chat": "Screenshots of in-game chat", "app.tos.reporting.proof.contract_link": "For reports related to contracts, a link to at least one contract violating these Terms.", "app.tos.reporting.proof.full_chatbox": "The full chatbox must be visible, including top tabs, bottom input box, and side scroll bar", "app.tos.reporting.proof.full_conversation": "Screenshots must include the full conversation from the first message. Multiple screenshots may be provided if necessary.", "app.tos.reporting.proof.no_comm": "For reports related to a Lister or Contactor stopping communication without explanation, the in-game chat must show that multiple attempts were made to contact the other party.{br}10 minutes must have passed since the first attempt with no response, or 5 minutes if the other party went offline.", "app.tos.reporting.proof.online_ingame": "For reports related to a Lister having a status of \"online in game\", the in-game chat must show that multiple attempts were made to contact the Lister.{br}15 minutes must have passed since the first message with no response, or 5 minutes if the Lister is offline.", "app.tos.reporting.proof.other": "Any other relevant information that the reporting user may deem necessary.", "app.tos.reporting.proof.profile": "A single screenshot of the Lister's profile showing their current status and relevant listings.{br}The filters above the listings may be used to fit all necessary information into one screenshot if needed.", "app.tos.reporting.proof.site_chat": "Screenshots of the Site chat", "app.tos.reporting.proof.site_chat_online": "For reports related to a Lister having a status of \"online\", the Site chat must show that 1 hour has passed with no response.", "app.tos.reporting.proof.site_indication": "There must be a clear indication that the Contactor found the Lister through the Site, such as using the copy/paste message, before the Lister's first response.", "app.tos.reporting.proof.timestamps": "Timestamps must be enabled in the game options", "app.tos.reporting.third_party": "Screenshots or other content from third-party applications will not be accepted as proof unless accompanied by proof of relevant data from the Site and/or in-game.", "app.tos.reputation": "Reputation", "app.tos.reputation.definition": "A user's reputation is based on the number of positive reviews submitted by other users.", "app.tos.reputation.no_artificial": "Users found to be artificially increasing their reputation, such as asking for positive reviews from other users without having already traded with them, will receive a permanent account suspension until such reviews are removed.", "app.tos.reputation.no_bribery": "Users may not attempt to bribe or force other users to give a positive review.", "app.tos.reputation.no_inappropriate": "Users may not leave positive reviews with content such as, but not limited to, self-promotion, links, or inappropriate material.", "app.tos.reputation.no_neg_abuse": "Positive reviews may not be used for reporting or justifying \"negative reputation\".", "app.tos.title": "Terms of Service | Warframe Market", "app.tos.trading": "Trading", "app.tos.trading.complete_trade": "Contactors who receive a trade invite, message response confirmation, or any other indication suggesting that the trade will be completed within 5 minutes of contacting the Lister are required to complete that trade with the Lister.{br}If the Lister does not respond within that time or does not take the necessary action to complete the trade, or the trade is otherwise not completed within the applicable time limit based on the Lister's status when contacted, the Contactor must notify the Lister that they are withdrawing from the trade before contacting another Lister.", "app.tos.trading.copyPaste": "The Site provides a generated message (\"copy/paste message\") that should be copied into the game's chat as a whisper message. This copy/paste message must be used as-is without modification at the start of contact and signifies the beginning of protection of both parties within these Terms.{br}Further messages may be used to attempt negotiation, such as asking about a different price, in which the Lister may choose to accept, reject, or respond with a counteroffer. If the Contactor chooses to negotiate, they may leave the protection of these Terms and the right to report the Lister who will remain in protection unless they accept or respond with a counteroffer.{br}The moderation team reserves the right to enforce the Terms at their discretion based on evidence provided even if negotiation is involved.{br}If the provided copy/paste message cannot be used for reasons such as the in-game paste function not working or being unable to copy text on the platform used to play Warframe, a custom message may be used in its place as long as the price and item are correct and the Site is mentioned in either the contacting message or any subsequent message that is within 2 minutes afterward and before the Lister responds.{br}Interactions where the Site is not mentioned at such a time are not covered by these Terms.", "app.tos.trading.honor_price": "Listers must honor the price of their order or contract at the time of being contacted unless their status is set to \"invisible\" at the time of initial contact or the listing is an obvious error such as entering price and quantity into the wrong fields.{br}In case of an obvious error, the order or contact must be corrected within 5 minutes.", "app.tos.trading.mr_requirement": "Listers and Contactors must meet the Mastery Rank requirement of items being traded and have sufficient credits and, when applicable, tradeable platinum at the time of contact.", "app.tos.trading.no_additional": "Listers and Contactors may not require the other party to buy, sell, or trade additional items or perform additional tasks prior to trading.", "app.tos.trading.no_bad_behavior": "Listers and Contactors may not engage in behavior such as namecalling, starting or escalating an argument, discriminating, threatening to report, harassing, or confronting after being reported or suspended.", "app.tos.trading.no_contact_no_intent": "Contactors may not contact Listers without an intent to trade.", "app.tos.trading.no_mid_trade": "Listers and Contactors may not change prices or items mid-trade unless approved by the other party.{br}Listers are still required to honor the original order when denying such proposals.", "app.tos.trading.no_stop_comm": "Listers and Contactors may not stop or refuse to communicate with the other party without a reasonable explanation.", "app.tos.trading.no_stop_comm.reasonable": "Reasonable explanations include the other party spamming, harassing, or otherwise being uncivil.", "app.tos.trading.no_stop_comm.refusing": "Refusing to communicate includes, but is not limited to, no longer responding to messages, using the ignore feature, disabling or repeatedly declining invites, and enabling Do Not Disturb mode.", "app.tos.trading.refuse_quantity": "Listers may not refuse to buy or sell a quantity at or lower than the total quantity and equal to a multiple of the minimum quantity per trade for the requested item as shown on the Site.{br}If no minimum quantity per trade is specified for the item, the Lister may not refuse any quantity at or lower than the total quantity.", "app.tos.trading.two_users": "The Lister and Contactor must be the only users involved during a trade.", "app.tos.transactions": "Transactions", "app.tos.transactions.accurate": "Transactions must accurately reflect the traded item and its quantity and price. Any transactions deemed suspicious, such as those with a quantity or price significantly outside of the current average, may require proof in the form of a screenshot taken at trade completion.", "app.tos.transactions.definition": "Transactions on a user's profile indicate orders that have been marked as bought or sold.", "app.tos.violations": "Violations", "app.tos.violations.action_required": "Violations that require action from the user, such as correcting a username, updating or removing a listing, or removing an inappropriate review, will result in a permanent account suspension until either the required action is taken or suspension removal is required for said action.", "app.tos.violations.definition": "Failure to follow these Terms may result in an account suspension, the duration of which depends on the number of prior infractions and severity.", "app.tos.violations.discretion": "The moderation team reserves the right to take actions against accounts at their sole discretion for any reason and holds the final right of interpretation and enforcement of these Terms.", "app.tos.violations.evasion": "Any attempts to evade a suspension or pose, impersonate, or imply being a Site staff member will result in a permanent account suspension.", "app.tos.violations.longer_suspension": "Violations that lead to a longer account suspension include, but are not limited to, those involving a listing for a recent Prime Access release, a recently added tradeable item, or a popular item affected by a game update or event that dramatically changes its availability (e.g. items from in-game event stores or Baro Ki'Teer).", "app.tos.violations.no_exemptions": "Site users will not be exempted from suspensions based on factors including, but not limited to: reputation, playtime, trade activity, usage of the Site, Mastery Rank, Patreon status, and report submission history."}}</script>
