name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 desktop-file-utils
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Source, UI and clean packaging tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
          RIVENSCOPE_PACKAGING: '1'
        run: .venv/bin/python -m unittest discover -s tests -t . -v
